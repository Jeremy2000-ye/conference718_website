<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>会议地点</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 腾讯地图 JS API -->
  <script src="https://map.qq.com/api/js?v=2.exp&key=JJABZ-AQSYA-TFLKT-CRX4B-HDACE-MUBLS"></script>
</head>
<body class="font-sans antialiased bg-gray-50">
    <!-- 顶部横幅图片 -->
    <div class="w-full overflow-hidden">
        <!-- 使用relative容器确保图片能超出父容器边缘 -->
        <div class="relative w-full">
            <img src="./images/banner2.png" alt="大会横幅" 
                 class="w-full min-w-full h-[clamp(120px,30vw,300px)] object-cover"
                 style="margin-left: calc(-50vw + 50%); width: 100vw;">
        </div>
    </div>

  <!-- 顶部标题 -->
  <section class="py-16">
    <div class="text-center mb-8">
      <h2 class="text-2xl md:text-3xl font-bold text-dark mb-4">会议地点</h2>
      <div class="w-20 h-1 bg-blue-600 mx-auto rounded-full"></div>
      <p class="text-gray-500 mt-4 text-xs">哈尔滨富力万达嘉华酒店</p>
    </div>

    <div class="grid md:grid-cols-2 gap-8 max-w-6xl mx-auto px-4">
      <!-- 地址信息 -->
      <div class="bg-white rounded-xl p-6 shadow-md space-y-4">
        <div class="flex items-start space-x-3">
          <i class="fa fa-building text-primary mt-1"></i>
          <div>
            <h4 class="text-lg font-semibold">酒店名称</h4>
            <p class="text-gray-700">哈尔滨富力万达嘉华酒店</p>
          </div>
        </div>
        <div class="flex items-start space-x-3">
          <i class="fa fa-map-pin text-primary mt-1"></i>
          <div>
            <h4 class="text-lg font-semibold">具体地址</h4>
            <p class="text-gray-700">黑龙江省哈尔滨市南岗区中兴大道158号</p>
          </div>
        </div>
        <div class="flex items-start space-x-3">
          <i class="fa fa-car text-primary mt-1"></i>
          <div>
            <h4 class="text-lg font-semibold">交通指引</h4>
            <p class="text-gray-700">地铁3号线哈西大街B出口，步行11分钟；自驾可停地下停车场</p>
          </div>
        </div>
        <div>
          <a href="https://j.map.baidu.com/fc/MVAk" target="_blank" class="text-blue-600 hover:underline inline-flex items-center">
            <i class="fa fa-external-link mr-2"></i>在百度地图中查看
          </a>
        </div>
      </div>

      <!-- 腾讯地图容器 -->
      <div class="bg-white rounded-xl shadow-md overflow-hidden h-[400px] relative">
        <div id="map" class="w-full h-full"></div>
      </div>
    </div>
  </section>
  
  <!-- 底部导航栏 -->
    <footer class="fixed bottom-0 left-0 w-full z-50 bg-gradient-to-t from-red-700 via-red-600 to-red-500 shadow-2xl rounded-t-xl">
  <div class="w-full px-4 py-3 flex justify-around items-center text-center text-sm md:text-base font-semibold text-yellow-100">
    
    <!-- 首页 -->
    <a href="index.html" class="flex flex-col items-center justify-center gap-1 hover:text-yellow-300 transition-colors duration-200">
      <i class="fa fa-home text-lg md:text-xl"></i>
      首页
    </a>

    <!-- 会议详情 -->
    <a href="details.html" class="flex flex-col items-center justify-center gap-1 hover:text-yellow-300 transition-colors duration-200">
      <i class="fa fa-calendar text-lg md:text-xl"></i>
      会议详情
    </a>

    <!-- 讲者简介 -->
    <a href="speakers.html" class="flex flex-col items-center justify-center gap-1 hover:text-yellow-300 transition-colors duration-200">
      <i class="fa fa-user text-lg md:text-xl"></i>
      讲者简介
    </a>

    <!-- 照片直播 -->
    <a href="photo.html"
       class="flex flex-col items-center justify-center gap-1 hover:text-yellow-300 transition-colors duration-200">
      <i class="fa fa-camera text-lg md:text-xl"></i>
      照片直播
    </a>

  </div>
</footer>

  <!-- 初始化地图脚本（需填入你自己的腾讯地图 Key 和坐标） -->
  <script>
    function initMap() {
      const center = new qq.maps.LatLng(45.701053, 126.594309); // 哈尔滨富力万达嘉华酒店附近坐标
      const map = new qq.maps.Map(document.getElementById("map"), {
        center: center,
        zoom: 16
      });
      const marker = new qq.maps.Marker({
        position: center,
        map: map
      });
    }

    // 确保腾讯地图 API 加载后执行
    window.onload = function () {
      if (typeof qq !== 'undefined') {
        initMap();
      }
    }
  </script>
</body>
</html>
